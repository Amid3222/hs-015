models:
  dnn:
    model_kwargs:
      hidden_size: 128


    optimizer_kwargs:
      lr: 1e-3
      weight_decay: 1e-5


  regression:
    versions:
      baseline:
        alpha: 1.0
        max_iter: 1000
        random_state: 42

      l2:
        alpha: 0.1
        max_iter: 3000
        random_state: 42
        selection: cyclic


      ridge_l2:
        alpha: 1.0
        max_iter: 1000
        random_state: 42
        solver: auto


      elasticnet:
        alpha: 1.0
        l1_ratio: 0.5
        max_iter: 1000
        random_state: 42
        selection: cyclic

  knn:
    versions:
      default:
        n_neighbors: 5
        weights: uniform
        algorithm: auto
        n_jobs: -1

  decision_tree:
    versions:
      default:
        max_depth: 5
        min_samples_split: 2
        min_samples_leaf: 1
        random_state: 42
        splitter: best

  random_forest:
    versions:
      best:
        n_estimators: 350
        max_depth: 7
        max_samples: 0.9
        min_samples_split: 2
        max_features: 7
        random_state: 42
        n_jobs: -1
        min_samples_leaf: 1

  catboost:
    versions:
      default:
        iterations: 250
        learning_rate: 0.073
        depth: 3
        l2_leaf_reg: 5
        random_state: 42
        verbose: false

  xgboost:
    versions:
      best:
        n_estimators: 450
        max_depth: 6
        learning_rate: 0.08
        subsample: 0.7
        colsample_bytree: 0.7
        min_child_weight: 4
        gamma: 0.2
        reg_alpha: 0.5
        reg_lambda: 1.5
        random_state: 32
        n_jobs: -1

        objective: reg:squarederror

  lightgbm:
    versions:
      default:
        num_leaves: 5
        min_data_in_leaf: 25
        learning_rate: 0.04
        n_estimators: 250
        n_jobs: -1
        random_state: 42
        objective: regression
        metric: rmse

  stacking:
    versions:
      default:
        base_models:
          knn:
            n_neighbors: 10
            n_jobs: -1

          tree:
            max_depth: 5
            random_state: 42
            min_samples_leaf: 5
        final_estimator: ridge
        cv: 5
        n_jobs: -1