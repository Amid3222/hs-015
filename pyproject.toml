[project]
name = "house_prices"
version = "0.1.0"
description = "House Prices regression — Classic ML final project"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "torch>=2.2",
    "catboost>=1.2",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "omegaconf>=2.3",
    "joblib>=1.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
